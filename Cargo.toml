[workspace]
resolver = "2"
members = [
    "ken-cli",
    "ken-api",
    "ken-runtime",
    "ken-tools",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rustyline = "15"
anthropic-auth = { version = "0.1", features = ["blocking", "browser"] }
url = "2"
