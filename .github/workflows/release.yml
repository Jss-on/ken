name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      prerelease_label: ${{ steps.meta.outputs.prerelease_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Detect pre-release: alpha, beta, rc
          if echo "$TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            LABEL=$(echo "$TAG" | sed 's/.*-\([a-z]*\).*/\1/')
            echo "prerelease_label=$LABEL" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "prerelease_label=" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice::Release v$TAG (prerelease=${{ steps.meta.outputs.prerelease || 'false' }})"

      - name: Verify tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi

  test:
    name: Test Gate
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.artifact }}
    needs: [validate, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ken-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ken-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ken dist/${{ matrix.artifact }}
          cp -r ken_tools dist/
          cp pyproject.toml dist/
          cp CHANGELOG.md dist/
          tar czf ${{ matrix.artifact }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  publish:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          PRERELEASE="${{ needs.validate.outputs.prerelease }}"
          LABEL="${{ needs.validate.outputs.prerelease_label }}"

          # Collect stats
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git log "${PREV_TAG}..HEAD" --oneline | wc -l)
            CONTRIBUTORS=$(git log "${PREV_TAG}..HEAD" --format='%aN' | sort -u | paste -sd ', ')
          else
            COMMIT_COUNT=$(git log --oneline | wc -l)
            CONTRIBUTORS=$(git log --format='%aN' | sort -u | paste -sd ', ')
          fi

          {
            echo "# Ken v$VERSION"
            echo ""

            if [ "$PRERELEASE" = "true" ]; then
              echo "> **${LABEL} pre-release** — not recommended for production use."
              echo ""
            fi

            # Try git-cliff for changelog body
            if command -v git-cliff >/dev/null 2>&1; then
              git-cliff --latest --strip header 2>/dev/null || true
            else
              # Extract current version section from CHANGELOG.md
              sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 || true
            fi

            echo ""
            echo "---"
            echo ""
            echo "**Stats:** $COMMIT_COUNT commits | Contributors: $CONTRIBUTORS"
            echo ""
            echo "**Install:**"
            echo '```bash'
            echo "# Download and extract"
            echo "curl -fsSL https://github.com/Jss-on/ken/releases/download/v${VERSION}/ken-linux-amd64.tar.gz | tar xz"
            echo "./ken-linux-amd64 setup-token"
            echo '```'
            echo ""
            echo "**Full changelog:** [v${PREV_TAG#v}...v${VERSION}](https://github.com/Jss-on/ken/compare/${PREV_TAG}...v${VERSION})"
          } > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > RELEASE_NOTES.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: false
